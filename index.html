<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDIOT Voting</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9933, #ffffff, #138808);
      margin: 0;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #666;
    }

    a {
      display: block;
      text-decoration: none;
      color: white;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      font-weight: bold;
    }

    .owner {
      background: #222;
    }

    .voter {
      background: #4f46e5;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>EDIOT Voting</h1>
    <p>Secure Voting System</p>

    <a class="owner" href="owner.html">
      OWNER PANEL
    </a>

    <a class="voter" href="voter.html">
      VOTER PANEL
    </a>
  </div>
</body>
</html>
