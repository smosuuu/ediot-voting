<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDIOT — Voter Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui;background:linear-gradient(135deg,#ff9933,#fff,#138808);min-height:100vh} .card{background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}</style>
</head>
<body class="p-4">
<div class="max-w-3xl mx-auto">
  <div class="card rounded-2xl shadow-xl p-6 text-center mb-5">
    <h1 class="text-3xl font-extrabold">EDIOT Voting</h1>
    <p class="text-gray-600">Voter Panel</p>
  </div>

  <div id="access" class="card rounded-2xl shadow-xl p-6 max-w-md mx-auto">
    <h2 class="text-xl font-bold mb-3">Enter Voter ID</h2>
    <p class="text-sm text-gray-600 mb-4">Only an ID registered by the owner can access the candidate list.</p>
    <input id="voterId" class="w-full p-3 rounded-lg border mb-3" placeholder="Voter ID">
    <button id="openBtn" class="w-full p-3 rounded-lg bg-indigo-600 text-white font-bold">Continue</button>
    <p id="msg" class="text-sm mt-3"></p>
  </div>

  <div id="votePanel" class="hidden">
    <div class="card rounded-2xl shadow-xl p-6 mb-5">
      <p class="text-gray-500">Voter</p>
      <h2 id="voterName" class="text-2xl font-bold"></h2>
      <p id="voterStatus" class="text-sm mt-1"></p>
    </div>
    <div id="candidateList" class="grid sm:grid-cols-2 gap-4"></div>
    <button id="castBtn" disabled class="w-full mt-5 p-4 rounded-xl bg-green-600 text-white font-bold disabled:opacity-50">CAST VOTE</button>
    <div id="result" class="hidden card rounded-2xl shadow-xl p-6 mt-5"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, get, runTransaction, set } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzoT0YnkwoIFKOc5BsDoP-L4Vpu3NZCLU",
  authDomain: "voting-machine-by-sm-techn.firebaseapp.com",
  databaseURL: "https://voting-machine-by-sm-techn-default-rtdb.firebaseio.com",
  projectId: "voting-machine-by-sm-techn",
  storageBucket: "voting-machine-by-sm-techn.firebasestorage.app",
  messagingSenderId: "853180794186",
  appId: "1:853180794186:web:b43d3640c741319df66db3",
  measurementId: "G-0S085H6LJ2"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const parties = {
  "BJP": { "name": "Bharatiya Janata Party (BJP)", "icon": "fa-fan", "color": "text-orange-500" },
  "INC": { "name": "Indian National Congress (INC)", "icon": "fa-hand", "color": "text-blue-500" },
  "NCP": { "name": "Nationalist Congress Party (NCP)", "icon": "fa-clock", "color": "text-sky-500" },
  "SIV": { "name": "Shiv Sena (UBT)", "icon": "fa-fire", "color": "text-red-500" },
  "SP": { "name": "Samajwadi Party (SP)", "icon": "fa-bicycle", "color": "text-green-600" },
  "AIMIM": { "name": "AIMIM", "icon": "fa-kite", "color": "text-emerald-700" },
  "NOTA": { "name": "None of the Above", "icon": "fa-ban", "color": "text-gray-500" }
};
const candidates = [
  { "id": "Mohsin", "name": "Mohsin", "partyKey": "BJP" },
  { "id": "Pratiksha", "name": "Pratiksha", "partyKey": "INC" },
  { "id": "Danish", "name": "Danish", "partyKey": "NCP" },
  { "id": "KadamVaishnavi", "name": "Kadam Vaishnavi", "partyKey": "SIV" },
  { "id": "Rashid", "name": "Rashid", "partyKey": "SP" },
  { "id": "Sharmeen", "name": "Sharmeen", "partyKey": "AIMIM" },
  { "id": "NOTA", "name": "NOTA", "partyKey": "NOTA" }
];

let currentId="", selected=null;

const $=id=>document.getElementById(id);
const enc=s=>encodeURIComponent(s);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderCandidates() {
  $("candidateList").innerHTML=candidates.map(c=>{
    const p=parties[c.partyKey];
    return `<button class="candidate text-left card rounded-2xl shadow p-5 border-2 border-transparent hover:border-indigo-500"
      data-id="${esc(c.id)}">
      <b class="text-xl">${esc(c.name)}</b>
      <span class="block text-sm text-gray-500 mt-1">${esc(p.name)}</span>
    </button>`;
  }).join("");
  document.querySelectorAll(".candidate").forEach(b=>b.onclick=()=>{
    selected=b.dataset.id;
    document.querySelectorAll(".candidate").forEach(x=>x.classList.remove("border-indigo-600"));
    b.classList.add("border-indigo-600");
    $("castBtn").disabled=false;
  });
}

$("openBtn").onclick=async()=>{
  const id=$("voterId").value.trim();
  if(!id) return $("msg").textContent="Enter voter ID.";
  const snap=await get(ref(db,"ediot/voters/"+enc(id)));
  if(!snap.exists()) return $("msg").textContent="Voter ID is not registered.";
  const v=snap.val();
  if(v.voted) return $("msg").textContent="This voter has already voted.";
  currentId=id;
  $("voterName").textContent=v.name;
  $("voterStatus").textContent="Voting access granted.";
  $("access").classList.add("hidden");
  $("votePanel").classList.remove("hidden");
  renderCandidates();
};

$("castBtn").onclick=async()=>{
  if(!selected || !currentId) return;
  $("castBtn").disabled=true;

  const voterRef=ref(db,"ediot/voters/"+enc(currentId));
  const voterTx=await runTransaction(voterRef,current=>{
    if(!current || current.voted) return;
    return {...current,voted:true,votedAt:new Date().toISOString(),votedFor:selected};
  });
  if(!voterTx.committed) {
    $("result").classList.remove("hidden");
    $("result").innerHTML='<b>Vote not recorded.</b><p>This voter has already voted.</p>';
    return;
  }

  const countRef=ref(db,"ediot/counts/"+enc(selected));
  await runTransaction(countRef,current=>(Number(current)||0)+1);

  await set(ref(db,"ediot/logs/"+enc(currentId)), {
    voterId:currentId, voterName:$("voterName").textContent, votedFor:selected, time:new Date().toISOString()
  });

  const cand=candidates.find(c=>c.id===selected);
  $("candidateList").innerHTML="";
  $("castBtn").classList.add("hidden");
  $("voterStatus").textContent="Vote successfully recorded. This voter ID is now locked.";
  $("result").classList.remove("hidden");
  $("result").innerHTML=`<h3 class="text-xl font-bold">Vote Successful ✅</h3>
    <p class="mt-2">Voter: ${esc($("voterName").textContent)}</p>
    <p>Selected: <b>${esc(cand?.name || selected)}</b></p>
    <p class="text-sm text-gray-500 mt-2">Your vote was recorded once and the voter ID is locked.</p>`;
};
</script>
</body></html>
