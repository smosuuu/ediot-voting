<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDIOT — Owner Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui;background:linear-gradient(135deg,#ff9933,#fff,#138808);min-height:100vh} .card{background:rgba(255,255,255,.92);backdrop-filter:blur(12px)}</style>
</head>
<body class="p-4">
<div class="max-w-5xl mx-auto">
  <div class="card rounded-2xl shadow-xl p-6 mb-5">
    <h1 class="text-3xl font-extrabold">EDIOT Voting — Owner Panel</h1>
    <p class="text-gray-600 mt-1">Register voters and watch verified votes live.</p>
  </div>

  <div id="login" class="card rounded-2xl shadow-xl p-6 max-w-md mx-auto">
    <h2 class="text-xl font-bold mb-4">Owner Login</h2>
    <input id="password" type="password" class="w-full p-3 rounded-lg border mb-3" placeholder="Owner password">
    <button id="loginBtn" class="w-full p-3 rounded-lg bg-gray-900 text-white font-bold">Open Owner Panel</button>
    <p id="loginMsg" class="text-red-600 text-sm mt-3"></p>
  </div>

  <div id="panel" class="hidden">
    <div class="grid md:grid-cols-3 gap-4 mb-5">
      <div class="card rounded-2xl shadow p-5"><p class="text-gray-500">Registered</p><b id="registeredCount" class="text-3xl">0</b></div>
      <div class="card rounded-2xl shadow p-5"><p class="text-gray-500">Votes Cast</p><b id="votesCount" class="text-3xl">0</b></div>
      <div class="card rounded-2xl shadow p-5"><p class="text-gray-500">Remaining</p><b id="remainingCount" class="text-3xl">0</b></div>
    </div>

    <div class="grid lg:grid-cols-2 gap-5">
      <div class="card rounded-2xl shadow-xl p-6">
        <h2 class="text-xl font-bold mb-4">Register Voter</h2>
        <input id="voterName" class="w-full p-3 rounded-lg border mb-3" placeholder="Voter name">
        <input id="voterId" class="w-full p-3 rounded-lg border mb-3" placeholder="Voter ID">
        <button id="addVoter" class="w-full p-3 rounded-lg bg-green-600 text-white font-bold">Add Voter</button>
        <p id="addMsg" class="text-sm mt-3"></p>
      </div>

      <div class="card rounded-2xl shadow-xl p-6">
        <h2 class="text-xl font-bold mb-4">Live Vote Count</h2>
        <div id="counts" class="space-y-2"></div>
        <div class="mt-4 p-3 bg-gray-100 rounded-lg font-bold">Total verified votes: <span id="total">0</span></div>
      </div>
    </div>

    <div class="card rounded-2xl shadow-xl p-6 mt-5">
      <h2 class="text-xl font-bold mb-4">Voter Status — Live</h2>
      <div id="voters" class="space-y-2"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzoT0YnkwoIFKOc5BsDoP-L4Vpu3NZCLU",
  authDomain: "voting-machine-by-sm-techn.firebaseapp.com",
  databaseURL: "https://voting-machine-by-sm-techn-default-rtdb.firebaseio.com",
  projectId: "voting-machine-by-sm-techn",
  storageBucket: "voting-machine-by-sm-techn.firebasestorage.app",
  messagingSenderId: "853180794186",
  appId: "1:853180794186:web:b43d3640c741319df66db3",
  measurementId: "G-0S085H6LJ2"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const OWNER_PASSWORD = "1432";
const parties = {
  "BJP": { "name": "Bharatiya Janata Party (BJP)", "icon": "fa-fan", "color": "text-orange-500" },
  "INC": { "name": "Indian National Congress (INC)", "icon": "fa-hand", "color": "text-blue-500" },
  "NCP": { "name": "Nationalist Congress Party (NCP)", "icon": "fa-clock", "color": "text-sky-500" },
  "SIV": { "name": "Shiv Sena (UBT)", "icon": "fa-fire", "color": "text-red-500" },
  "SP": { "name": "Samajwadi Party (SP)", "icon": "fa-bicycle", "color": "text-green-600" },
  "AIMIM": { "name": "AIMIM", "icon": "fa-kite", "color": "text-emerald-700" },
  "NOTA": { "name": "None of the Above", "icon": "fa-ban", "color": "text-gray-500" }
};
const candidates = [
  { "id": "Mohsin", "name": "Mohsin", "partyKey": "BJP" },
  { "id": "Pratiksha", "name": "Pratiksha", "partyKey": "INC" },
  { "id": "Danish", "name": "Danish", "partyKey": "NCP" },
  { "id": "KadamVaishnavi", "name": "Kadam Vaishnavi", "partyKey": "SIV" },
  { "id": "Rashid", "name": "Rashid", "partyKey": "SP" },
  { "id": "Sharmeen", "name": "Sharmeen", "partyKey": "AIMIM" },
  { "id": "NOTA", "name": "NOTA", "partyKey": "NOTA" }
];

const $ = id => document.getElementById(id);
const votersRef = ref(db, "ediot/voters");
const countsRef = ref(db, "ediot/counts");
const logsRef = ref(db, "ediot/logs");

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderCounts(data={}) {
  let total = 0;
  $("counts").innerHTML = candidates.map(c => {
    const n = Number(data[c.id] || 0); total += n;
    return `<div class="flex justify-between p-3 rounded-lg bg-gray-100"><span>${esc(c.name)}</span><b>${n}</b></div>`;
  }).join("");
  $("total").textContent = total;
  $("votesCount").textContent = total;
  return total;
}

function renderVoters(data={}) {
  const ids = Object.keys(data);
  $("registeredCount").textContent = ids.length;
  $("remainingCount").textContent = ids.filter(id => !data[id].voted).length;
  $("voters").innerHTML = ids.length ? ids.map(id => {
    const v=data[id];
    return `<div class="flex justify-between items-center p-3 rounded-lg border bg-white">
      <span><b>${esc(v.name)}</b><br><small class="text-gray-500">${esc(id)}</small></span>
      <b class="${v.voted?'text-green-600':'text-orange-600'}">${v.voted?'VOTED':'READY'}</b>
    </div>`;
  }).join("") : '<p class="text-gray-500">No voters registered.</p>';
}

$("loginBtn").onclick = () => {
  if ($("password").value !== OWNER_PASSWORD) return $("loginMsg").textContent = "Incorrect password.";
  $("login").classList.add("hidden"); $("panel").classList.remove("hidden");
  onValue(votersRef, s => renderVoters(s.val() || {}));
  onValue(countsRef, s => renderCounts(s.val() || {}));
};

$("addVoter").onclick = async () => {
  const name=$("voterName").value.trim(), id=$("voterId").value.trim();
  if(!name || !id) return $("addMsg").textContent="Enter both name and voter ID.";
  const snap=await get(ref(db, "ediot/voters/"+encodeURIComponent(id)));
  if(snap.exists()) return $("addMsg").textContent="Voter ID already exists.";
  await set(ref(db, "ediot/voters/"+encodeURIComponent(id)), {name, voted:false, registeredAt:new Date().toISOString()});
  $("voterName").value=""; $("voterId").value="";
  $("addMsg").textContent="Voter registered. They can now open the voter page.";
};
</script>
</body></html>
